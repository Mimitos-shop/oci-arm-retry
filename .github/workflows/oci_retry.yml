name: OCI ARM Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/7 * * * *'

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: pip install oci

      - name: Set up OCI Config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          # Aquí guardamos la llave pública
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > ~/.oci/ssh_key.pub
          
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY }}" >> ~/.oci/config
          echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
          echo "key_file=/home/runner/.oci/oci_api_key.pem" >> ~/.oci/config
          
          # Aquí le decimos al script dónde está la llave pública
          echo "ssh_public_key_file=/home/runner/.oci/ssh_key.pub" >> ~/.oci/config

      - name: Run OCI retry script
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: python oci_retry.py
