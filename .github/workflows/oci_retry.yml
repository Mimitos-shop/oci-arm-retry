name: OCI ARM Retry

on:
  workflow_dispatch:
  schedule:
    - cron: '*/7 * * * *'

jobs:
  retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: pip install oci cryptography

      - name: Set up OCI Config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci

          python - <<'PY'
          import os
          import base64
          from pathlib import Path
          from cryptography.hazmat.primitives.serialization import load_pem_private_key

          encoded = os.environ["OCI_PRIVATE_KEY"].strip()

          try:
              pem = base64.b64decode(encoded, validate=True)
              load_pem_private_key(pem, password=None)
          except Exception as e:
              raise SystemExit(
                  "ERROR: No se pudo decodificar o validar la clave privada: "
                  + type(e).__name__
              )

          key_path = Path.home() / ".oci/oci_api_key.pem"
          key_path.write_bytes(pem)
          os.chmod(key_path, 0o600)

          ssh = os.environ["OCI_SSH_PUBLIC_KEY"].strip()
          if not ssh:
              raise SystemExit("ERROR: Falta OCI_SSH_PUBLIC_KEY")

          ssh_path = Path.home() / ".oci/ssh_key.pub"
          ssh_path.write_text(ssh + "\n", encoding="utf-8")

          print("OK: Clave privada validada y guardada.")
          print("OK: Clave SSH guardada.")
          PY

          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=/home/runner/.oci/oci_api_key.pem"
            echo "ssh_public_key_file=/home/runner/.oci/ssh_key.pub"
          } > ~/.oci/config

      - name: Run OCI retry script
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: python oci_retry.py
